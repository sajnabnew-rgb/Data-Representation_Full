<body><div class="wrap">
<div class="top"><div><h1>Images, Text, Sound and Compression</h1><div class="sub">IGCSE Computer Science 4CP0: bitmap images, colour, ASCII and Unicode, sound sampling and RLE compression</div><div class="sub" id="who"></div></div>
<div class="stats"><div class="stat"><b id="sc">0</b><span>Score</span></div><div class="stat"><b id="sk">0</b><span>Streak</span></div><div class="stat"><b id="ms">0</b><span>Mistakes</span></div><div class="stat"><b id="tm">0m 00s</b><span>Level time</span></div><button class="btn alt" id="rs">Reset level</button><button class="btn alt" onclick="summary()">Progress report</button><button class="btn alt" onclick="saveDlg()">Save progress</button><button class="btn alt" onclick="welcome()">Player</button><button class="btn alt" onclick="rules(false)">Rules</button></div></div>
<div class="tabs" id="tabs"></div>
<div class="prog"><i id="pb"></i></div>
<div class="lvl"><span class="badge" id="bd"></span><b id="lt"></b> <small id="pt" style="color:var(--mut)"></small></div>
<div class="fb" id="fb"></div>
<div class="main">
<div class="card"><h2>Question</h2><div id="q"></div></div>
<div><div class="card"><h2>Method</h2><div id="help"></div></div>
<div class="card"><h2>Worked solution</h2><div id="work"></div></div></div>
</div></div><div class="modal" id="m"></div>
<script>
// ================= HELPERS =================
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const B=(n,w=8)=>((n%2**w+2**w)%2**w).toString(2).padStart(w,'0');
const HX=(n,d=2)=>n.toString(16).toUpperCase().padStart(d,'0');
const nib=s=>s.replace(/(.{4})(?=.)/g,'$1 ');
const fmtN=n=>Number(n).toLocaleString('en-GB');
const big=s=>`<b class="big">${s}</b>`;
const bitsFor=n=>Math.max(1,Math.ceil(Math.log2(n)));
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
// question makers. m = the numbers behind the question (used to check the answers independently)
const Q=(html,ans,work,hint,extra={})=>Object.assign({html,mode:'num',ans:String(ans),work,hint:hint||(()=>'')},extra);
const BQ=(html,bits,work,hint,extra={})=>Object.assign({html,mode:'bits',w:bits.length,head:Array.from({length:bits.length},(_,i)=>i+1),ans:bits,work,hint:hint||(()=>'')},extra);
const CQ=(html,ans,opts,work,hint,extra={})=>Object.assign({html,mode:'choice',ans,opts,work,hint:hint||(()=>'')},extra);
// typed text answers (RLE, letters, words): spaces and commas are ignored
const TQ=(html,ans,work,hint,extra={})=>Object.assign({html,mode:'text',ans,work,hint:hint||(()=>''),ph:'your answer'},extra);
// a picture of pixels. rows: strings of W/B, or colour codes with a key
function grid(rows,key){const col=key||{W:'#ffffff',B:'#111827'};return `<table class="px">${rows.map((r,i)=>`<tr><th>${i+1}</th>${[...r].map(c=>`<td style="background:${col[c]}" title="${c}"></td>`).join('')}</tr>`).join('')}</table>`}
// run-length encoding: "WWWBB" -> [[3,'W'],[2,'B']]
function runs(s){const o=[];for(const c of s){if(o.length&&o[o.length-1][1]==c)o[o.length-1][0]++;else o.push([1,c])}return o}
const rle=s=>runs(s).map(r=>r[0]+r[1]).join('');
function runString(cs,minRun=1,maxRun=6,len=[3,5]){const n=R(len[0],len[1]),out=[];let last='';for(let i=0;i<n;i++){let c;do{c=pick(cs)}while(c==last);last=c;out.push(c.repeat(R(minRun,maxRun)))}return out.join('')}
// a small sound wave drawn as an SVG with n sample points in t seconds
function wave(n,t=1){const W=440,H=150,x0=30,y0=75,pts=[];for(let i=0;i<=200;i++){const x=x0+i*(W-x0-10)/200,y=y0-48*Math.sin(i/200*Math.PI*2*t*1.5)*Math.cos(i/200*Math.PI*0.7);pts.push(`${x.toFixed(1)},${y.toFixed(1)}`)}
 const samp=Array.from({length:n},(_,k)=>{const i=Math.round((k+0.5)/n*200),x=x0+i*(W-x0-10)/200,y=y0-48*Math.sin(i/200*Math.PI*2*t*1.5)*Math.cos(i/200*Math.PI*0.7);return `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y}" class="smp"/><circle cx="${x}" cy="${y}" r="3.5" class="dot"/>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H+20}" class="wave" role="img" aria-label="Sound wave with ${n} samples"><line x1="${x0}" y1="${y0}" x2="${W-5}" y2="${y0}" class="ax"/><line x1="${x0}" y1="10" x2="${x0}" y2="${H}" class="ax"/><polyline points="${pts.join(' ')}" class="wv"/>${samp}<text x="${W-5}" y="${H+15}" text-anchor="end" class="lb">time: ${t} second${t>1?'s':''}</text><text x="${x0+4}" y="16" class="lb">amplitude</text></svg>`}
const sizeExprOpts=(w,h,d,unit)=>{const base=`${w} × ${h} × ${d}`;const c={bits:base,bytes:`${base} ÷ 8`,KiB:`${base} ÷ 8 ÷ 1024`,MiB:`${base} ÷ 8 ÷ 1024 ÷ 1024`};
 const wrong={bits:[`${base} ÷ 8`,`${w} × ${h} ÷ 8`,`${w} + ${h} + ${d}`],bytes:[base,`${base} × 8`,`${w} × ${h} ÷ 8`],KiB:[`${base} ÷ 1024`,`${base} ÷ 8 ÷ 1000`,`${base} × 8 ÷ 1024`],MiB:[`${base} ÷ 8 ÷ 1024`,`${base} ÷ 8 ÷ 1000 ÷ 1000`,`${base} ÷ 1024 ÷ 1024`]}[unit];return [c[unit],wrong]};
// ================= WORKED SOLUTIONS =================
const wSize=(w,h,d,unit,v)=>`<p>File size = width × height × colour depth (in bits).</p><p>${fmtN(w)} × ${fmtN(h)} × ${d} = <b>${fmtN(w*h*d)}</b> bits</p>${unit!='bits'?`<p>÷ 8 = ${fmtN(w*h*d/8)} bytes</p>`:''}${unit=='KiB'||unit=='MiB'?`<p>÷ 1024 = ${fmtN(w*h*d/8/1024)} KiB</p>`:''}${unit=='MiB'?`<p>÷ 1024 = ${fmtN(w*h*d/8/1024/1024)} MiB</p>`:''}<p>Answer: <b>${fmtN(v)}</b> ${unit}</p>`;
const wSound=(f,b,t,unit,v)=>`<p>File size = sample rate × bit depth × time (seconds).</p><p>${fmtN(f)} × ${b} × ${t} = <b>${fmtN(f*b*t)}</b> bits</p>${unit!='bits'?`<p>÷ 8 = ${fmtN(f*b*t/8)} bytes</p>`:''}${unit=='KiB'||unit=='MiB'?`<p>÷ 1024 = ${fmtN(f*b*t/8/1024)} KiB</p>`:''}${unit=='MiB'?`<p>÷ 1024 = ${fmtN(f*b*t/8/1024/1024)} MiB</p>`:''}<p>Answer: <b>${fmtN(v)}</b> ${unit}</p>`;

 hard=T.map((k,i)=>[i,mm[i]]).sort((a,b)=>b[1]-a[1])[0],slow=T.map((k,i)=>[i,tim[i]]).sort((a,b)=>b[1]-a[1])[0],
 tier=['LA','MA','HA'].map(t=>{const ix=T.map((k,i)=>k.lv==t?i:-1).filter(i=>i>=0);return `${TN[t]}: ${ix.filter(i=>i<unlocked).length} of ${ix.length}`}).join(' · ');
 return `<div class="dash"><p><b>Progress: ${d} of ${n} levels passed</b> <span class="fact">(${tier})</span></p><div class="prog"><i style="width:${d/n*100}%"></i></div><div class="stats" style="justify-content:center">${[['Score',score],['Attempts',sum(att)],['Time',fmt(sum(tim))],['Mistakes',sum(mm)]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="tw"><table class="st"><tr><th>Level</th><th>Tier</th><th>Status</th><th>Attempts</th><th>Time</th><th>Mistakes</th><th>Best</th></tr>${rows}</table></div><p class="fact">${hard[1]?`Most mistakes: Level ${hard[0]+1}, ${esc(T[hard[0]].t)}. `:''}${slow[1]?`Most time spent: Level ${slow[0]+1} (${fmt(slow[1])}).`:'Play a level to see your analysis here.'}</p></div>`}
function summary(){tick();modal(`<h2>Progress and analysis report</h2><p>${pav} <b>${esc(pname)||'Player'}</b>${pyear?', '+esc(pyear):''}. Images, Text, Sound and Compression, IGCSE Computer Science (Edexcel 4CP0). ${new Date().toLocaleDateString()}</p>${dash()}<p class="np"><button class="btn" onclick="copyReport(this)">Copy report</button> <button class="btn alt" onclick="try{print()}catch(_){}">Print or save as PDF</button> <button class="btn alt" onclick="closeM()">Close</button></p>`)}
function copyReport(b){const t=['Images, Text, Sound and Compression progress report',`${pname||'Player'}${pyear?', '+pyear:''}`,`Score: ${score}, ${passedN()} of ${T.length} levels passed, total time ${fmt(sum(tim))}`,'Level\tTier\tAttempts\tTime\tMistakes\tBest'].concat(T.map((k,i)=>`${i+1}. ${k.t}\t${TN[k.lv]}\t${att[i]}\t${fmt(tim[i])}\t${mm[i]}\t${best[i]==null?'-':best[i]}`)).join('\n');
 const ok=()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy report',1500)};
 try{navigator.clipboard.writeText(t).then(ok,()=>{b.textContent='Copy blocked'})}catch(_){b.textContent='Copy blocked'}}
function cert(){confetti();modal(`<div class="cert"><h2>${pav} Certificate of Achievement</h2><p>This certifies that</p><p class="cn"><span id="cn">${esc(pname)||'your name here'}</span></p><p>${pyear?'('+esc(pyear)+') ':''}has completed all ${T.length} levels of Images, Text, Sound and Compression for IGCSE Computer Science (Edexcel 4CP0), from Beginner to Expert.</p><p>Total score: <b>${score}</b> points. Rank: <b>${rank()}</b></p>${tbl()}<p>${new Date().toLocaleDateString()}</p></div><p class="np"><input placeholder="Type your name" value="${esc(pname).replace(/"/g,'&quot;')}" oninput="pname=this.value;$('#cn').textContent=pname||'your name here';save();who()"></p><p class="np"><button class="btn" onclick="try{print()}catch(_){}">Print or save as PDF</button> <button class="btn alt" onclick="summary()">Progress report</button> <button class="btn alt" onclick="restart()">Play again</button> <button class="btn alt" onclick="closeM()">Close</button></p>`)}
function tbl(){return `<div class="tw"><table class="st"><tr><th>Level</th><th>Tier</th><th>Best score</th></tr>`+T.map((k,i)=>`<tr><td>${i+1}. ${esc(k.t)}</td><td>${TN[k.lv]}</td><td>${best[i]!=null?best[i]+' pts':'not yet'}</td></tr>`).join('')+`</table></div>`}
function clearProgress(){ti=0;score=0;unlocked=0;att=T.map(()=>0);mm=T.map(()=>0);best=T.map(()=>null);tim=T.map(()=>0);pon=T.map(()=>0)}
function restart(){closeM();clearProgress();save();build()}
// ================= PLAYER, RULES, SAVE CODE =================
function who(){$('#who').textContent=pname?`${pav} ${pname}${pyear?', '+pyear:''}`:''}
const AV=['🤖','🚀','🦊','🐉','🧠','⚡','🎮','🦄'],YR=['Year 9','Year 10','Year 11','Year 12','Year 13'],
 FACTS=['A 1920 × 1080 screen has over 2 million pixels.','CDs store sound at 44 100 samples per second with 16-bit samples.','The ASCII code for A is 65 and for a is 97: they are exactly 32 apart.','24-bit colour can show over 16.7 million colours.','RLE works brilliantly on simple pictures with big blocks of colour, but badly on photos.','Unicode can represent over a million characters, including emoji.'];
function welcome(){const saved=att.some(a=>a>0);
 modal(`<h2>Images, Text, Sound and Compression</h2><p>Practise bitmap images, colour depth, ASCII and Unicode, sound sampling, file sizes and RLE compression in ${T.length} levels, from Beginner to Expert, and earn your certificate.</p><p><button class="lnk" onclick="rules(true)">📖 Read the rules first</button></p><p>Pick your avatar:</p><div class="avs">${AV.map(a=>`<button class="av${a==pav?' on':''}" onclick="pav='${a}';welcome()">${a}</button>`).join('')}</div><p><input id="pn" placeholder="Your name" maxlength="40" value="${esc(pname).replace(/"/g,'&quot;')}" oninput="pname=this.value"><select id="py" onchange="pyear=this.value"><option value="">Year group</option>${YR.map(y=>`<option${y==pyear?' selected':''}>${y}</option>`).join('')}</select></p><p class="we" id="we"></p><p class="fact">Did you know? ${esc(FACTS[Math.floor(Math.random()*FACTS.length)])}</p><p><button class="btn" onclick="begin()">${saved?'Continue':'Start'}</button> <button class="btn alt" onclick="rules(true)">Rules</button> <button class="btn alt" onclick="loadDlg(true)">Load progress from another device</button>${saved?' <button class="btn alt" onclick="newPlayer()">New player (clears progress)</button>':''}</p>${dash()}`)}
function begin(){pname=pname.trim();if(!pname||!pyear){$('#we').textContent='Please enter your name and choose a year group.';return}save();closeM();who();const f=$('#ans')||$('.bit');if(f)f.focus()}
function isThis(){modal(`<h2>Welcome back!</h2><p style="font-size:2.4rem;margin:4px">${pav}</p><p>Is this still <b>${esc(pname)}</b>${pyear?' ('+esc(pyear)+')':''}?</p><button class="btn" onclick="welcome()">Yes, that’s me</button> <button class="btn alt" onclick="newPlayer()">No, I’m someone else</button><p class="fact">Choosing “No” clears the saved progress on this browser and starts a new player.</p>`)}
function newPlayer(){pname='';pyear='';pav='🤖';clearProgress();save();build();welcome()}
function rules(back){modal(`<h2>Rules and how to play</h2><p>Each Beginner and Intermediate level has 5 questions, and each Expert level has 10. The questions are new every time you play.</p><ul><li>Type your answer and press Check or Enter. For 8-bit answers, click the bits to switch them between 0 and 1. For RLE and letters, type the answer (spaces and capitals do not matter). For “complete the expression” questions, type a number in each box; width, height and colour depth can go in any order.</li><li>Numbers can be typed with or without commas. Hex colour codes can be typed with or without the #. Long binary answers can be typed with or without spaces.</li><li>Correct: +10 points plus streak bonuses. Wrong: −3 points and a hint.</li><li>After two wrong tries on a question, the worked solution appears on the right. After every correct answer it shows the working too.</li><li>Finish a level with <b>${MAXM} mistakes or fewer</b> to unlock the next one. No mistakes earns +20 and 3 stars.</li><li>Your progress is saved in this browser. To carry on from another device, press Save progress and copy the code (or download the progress file). On the other device, press <b>Load progress from another device</b> on the welcome screen.</li><li>Finish all ${T.length} levels to earn your certificate.</li></ul><button class="btn" onclick="${back?'welcome()':'closeM()'}">${back?'Back':'Close'}</button>`)}
// ---- moving progress to another device ----
// Short code format: MR2|name|year number|avatar number|score|one entry per level played, joined by ~
// Each level entry: 3-character level id, then attempts.mistakes.best.seconds.passed-on-attempt (all in base 36).
// Levels are found by id, so codes still work after levels are added. Old long codes still load.
const lid=k=>{let h=7;for(const c of KEY(k))h=(h*31+c.charCodeAt(0))>>>0;return (h%46656).toString(36).padStart(3,'0')};
const b36=n=>Math.max(0,Math.round(n||0)).toString(36);
function saveCode(){tick();
 const lv=T.map((k,i)=>att[i]||best[i]!=null||tim[i]>=1000?lid(k)+[att[i],mm[i],best[i]==null?'':best[i],tim[i]/1000,pon[i]].map((x,j)=>j==2&&x===''?'':b36(x)).join('.'):'').filter(Boolean).join('~');
 return ['MR2',encodeURIComponent(pname),YR.indexOf(pyear),AV.indexOf(pav),b36(score),lv].join('|')}
function readCode(raw){const c=String(raw).replace(/\s/g,'');
 if(c.startsWith('MR2|')){const p=c.split('|');if(p.length!=6)throw 0;
  const ids=new Map(T.map((k,i)=>[lid(k),i]));clearProgress();
  pname=decodeURIComponent(p[1]).slice(0,40);pyear=YR[+p[2]]||'';pav=AV[+p[3]]||'🤖';score=parseInt(p[4],36)||0;
  (p[5]?p[5].split('~'):[]).forEach(e=>{const i=ids.get(e.slice(0,3));if(i==null)return;const f=e.slice(3).split('.');if(f.length!=5)throw 0;
   att[i]=parseInt(f[0],36)||0;mm[i]=parseInt(f[1],36)||0;best[i]=f[2]===''?null:parseInt(f[2],36);tim[i]=(parseInt(f[3],36)||0)*1000;pon[i]=parseInt(f[4],36)||0});
  let u=0;while(u<T.length&&best[u]!=null)u++;unlocked=u;return true}
 const d=JSON.parse(decodeURIComponent(escape(atob(c))));clearProgress();if(!apply(d))throw 0;return true}
function saveDlg(){tick();save();const code=saveCode();modal(`<h2>Save your progress</h2><p>Your progress is saved automatically in this browser. To carry on from another device, use one of these:</p><p style="text-align:left"><b>1. Copy this code</b> and send it to yourself (for example by email or Teams):</p><textarea id="sc2" readonly rows="3" style="width:100%;font:13px ui-monospace,Menlo,Consolas,monospace">${esc(code)}</textarea><p><button class="btn" onclick="cp()">Copy code</button> <span class="fact">${code.length} characters</span></p><p style="text-align:left"><b>2. Or download a progress file</b> and open it on the other device:</p><p><button class="btn alt" onclick="dl()">Download progress file</button></p><p class="we" id="le"></p><p><button class="btn alt" onclick="loadDlg(false)">Load progress on this device</button> <button class="btn alt" onclick="closeM()">Close</button></p>`)}
function loadDlg(back){modal(`<h2>Load your progress</h2><p>Paste the code you saved on your other device, or open your progress file. This replaces any progress saved on this device.</p><textarea id="lc" rows="3" style="width:100%;font:13px ui-monospace,Menlo,Consolas,monospace" placeholder="Paste your code here (it starts with MR2)"></textarea><p><button class="btn" onclick="loadCode(${back})">Load progress</button></p><p>or <label class="btn alt" style="display:inline-block">Open progress file<input type="file" id="lf" accept=".txt,text/plain" style="display:none" onchange="loadFile(this,${back})"></label></p><p class="we" id="le"></p><p><button class="btn alt" onclick="${back?'welcome()':'closeM()'}">${back?'Back':'Cancel'}</button></p>`)}
function cp(){const t=$('#sc2'),e=$('#le');t.select();const ok=()=>{e.style.color='var(--ok)';e.textContent='Code copied. Paste it somewhere safe, such as an email to yourself.'};
 try{navigator.clipboard.writeText(t.value).then(ok,()=>{try{document.execCommand('copy');ok()}catch(_){e.textContent='Copy was blocked: select the code and press Ctrl+C.'}})}catch(_){try{document.execCommand('copy');ok()}catch(__){e.textContent='Copy was blocked: select the code and press Ctrl+C.'}}}
// on GitHub (or any normal web page) the file is made with a download link; inside the Claude viewer its downloads service is used
async function dl(){const e=$('#le'),name=`images-sound-progress-${(pname||'player').replace(/[^\w-]+/g,'-')}.txt`,code=saveCode();
 const done=()=>{e.style.color='var(--ok)';e.textContent='Progress file saved. Keep it somewhere you can open on the other device.'};
 try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:code});return done()}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()}
 catch(_){e.style.color='var(--bad)';e.textContent='The file was not saved. Use the code instead.'}}
function loadFile(inp,back){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#lc').value=String(r.result).trim();loadCode(back)};r.readAsText(f)}
function loadCode(back){const e=$('#le');e.style.color='var(--bad)';const raw=$('#lc').value.trim();if(!raw){e.textContent='Paste your code first.';return}
 const keep=JSON.stringify(data());try{readCode(raw)}catch(_){try{apply(JSON.parse(keep))}catch(__){}e.textContent='That code did not work. Check that you copied all of it, from MR2 to the end.';return}
 save();t0=0;ti=Math.min(unlocked,T.length-1);build();welcome();const msg=`Progress loaded for ${pname||'this player'}: ${passedN()} of ${T.length} levels passed.`,w=$('#we');w.style.color='var(--ok)';w.textContent=msg+' Press Continue.';fb('ok',esc(msg))}
// ================= POP-UPS, CONFETTI, CLICKS AND KEYS =================
function modal(h){pause();$('#m').innerHTML=`<div class="mc">${h}</div>`;$('#m').style.display='flex'}
function closeM(){$('#m').style.display='none';resume()}
function confetti(){for(let i=0;i<40;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},80%,60%);animation-delay:${Math.random()*.4}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
$('#q').addEventListener('click',e=>{const t=e.target;let x;
 if(x=t.closest('[data-bit]'))return setBit(+x.dataset.bit);
 if(x=t.closest('[data-opt]'))return check(+x.dataset.opt);
 if(t.closest('#clr')){if(QS[qi]&&QS[qi].mode=='blanks'){document.querySelectorAll('#q input.bl').forEach(x=>{x.value='';x.classList.remove('wrong','right')});const f=$('input.bl');if(f)f.focus()}else bits.forEach((_,i)=>setBit(i,'0'));return}
 if(t.closest('#chk'))return check()});
$('#q').addEventListener('keydown',e=>{const x=e.target.closest('[data-bit]');
 if(e.key=='Enter'){e.preventDefault();return check()}
 if(!x)return;const i=+x.dataset.bit,mv=j=>{const n=$(`[data-bit="${j}"]`);if(n)n.focus()};
 if(e.key=='0'||e.key=='1'){e.preventDefault();setBit(i,e.key);mv(i+1)}
 else if(e.key=='ArrowRight'){e.preventDefault();mv(i+1)}else if(e.key=='ArrowLeft'){e.preventDefault();mv(i-1)}});
$('#rs').onclick=()=>{if(!locked)score=startScore;build()};
load();ti=Math.min(unlocked,T.length-1);build();if(pname)isThis();else welcome();
</script></body></html>
